# PodReader Nginx reverse proxy config (HTTP only, LAN)
# Variables to replace: ${LAN_IP}, ${APP_DIR}
#
# Nginx proxy timeout rationale:
#   - Transcription (Whisper API): typically 2-5 min for a long episode
#   - Local LLM summarisation via Ollama (map-reduce on CPU):
#       30-min podcast ~ 16 chunks x 45s = ~12 min
#       60-min podcast ~ 31 chunks x 45s = ~23 min
#       2-hour podcast ~ 62 chunks x 45s = ~47 min
#   Setting to 3600s (1 hour) to cover the longest realistic episodes
#   without being infinite. The app's own OLLAMA_INFERENCE_TIMEOUT_MS
#   (10 min per individual chunk) is the real safety net.

server {
    listen 80;
    server_name ${LAN_IP} _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # Long timeout for local LLM summarisation (map-reduce over many chunks)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    # API routes -> Express
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Static frontend assets served by Nginx
    location / {
        root ${APP_DIR}/dist;
        try_files $uri $uri/ /index.html;

        # index.html must never be cached so new asset filenames are picked up
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
